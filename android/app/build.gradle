plugins {
    id 'com.android.application'
}

android {
    namespace 'com.typekeep.companion'
    compileSdk 35

    defaultConfig {
        applicationId "com.typekeep.companion"
        minSdk 24
        targetSdk 35
        versionCode 340
        versionName "3.4.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
